<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <title>Calculatrice civique 2027</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>Calculatrice civique 2027</h1>

  <div class="dashboard">

    <!-- REFUS -->

    <div class="colonne">

      <h2>
        1. Refus absolus
      </h2>

      <p>
        Quels candidats refusez-vous
        absolument de voir élus ?
      </p>

      <div id="liste-refus"></div>

    </div>

    <!-- ACCEPTABLES -->

    <div class="colonne">

      <h2>
        2. Acceptables
      </h2>

      <p>
        Pour quels candidats pourriez-vous
        encore voter au second tour ?
      </p>

      <div id="liste-acceptables"></div>

    </div>

    <!-- DUELS -->

    <div class="colonne">

      <h2>
        3. Duels
      </h2>

      <div id="scenarios"></div>

    </div>

    <!-- STRATEGIE -->

    <div class="colonne strategie">

      <h2>
        4. Vote stratégique
      </h2>

      <div id="strategie"></div>

    </div>

  </div>

  <script src="candidats.js"></script>
  <script src="app.js"></script>

</body>
</html>
